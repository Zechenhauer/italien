        body { background-color: #070f26; color: #f1f5f9; }

</head>
<body class="p-4 md:p-8 font-sans min-h-screen">

    <div class="max-w-[95rem] mx-auto space-y-6">
        
        <!-- HEADER -->

            </div>
            
            <div class="flex flex-wrap items-center gap-3">

                    LIVE SPIEL LÄUFT (Auto-Update 15s)

                <!-- Spieltag / Zeitraum Auswahl -->

                        <option value="23">23. Spieltag (07.02. - 07.02.)</option>
                        <option value="24">24. Spieltag (14.02. - 14.02.)</option>

                </div>

                <!-- Dynamisches Datumsfeld -->
                <div id="single-date-wrapper" class="hidden items-center gap-2 bg-blue-950 border border-blue-800 px-3 py-1 rounded-lg shadow-inner">
                    <input type="date" id="single-date-input" onchange="loadSerieAGames()" class="bg-transparent text-emerald-400 font-bold text-sm focus:outline-none cursor-pointer">
                </div>

                <button onclick="refreshAllData()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg shadow transition flex items-center gap-2 border border-blue-400/30">
                    🔄 Aktualisieren
                </button>
            </div>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="flex border-b border-blue-900/60 space-x-2">
            <button id="tab-btn-games" onclick="switchTab('games')" class="px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-900/80 text-emerald-400 border-t-2 border-emerald-400 transition shadow-lg">
                ⚽ Serie A Spielplan
            </button>
            <button id="tab-btn-standings" onclick="switchTab('standings')" class="px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-950/40 text-slate-400 hover:text-white transition">
                📊 Serie A Tabelle
            </button>
        </div>

        <!-- TAB 1: SPIELE & LIVE SCORES -->
        <div id="tab-content-games" class="space-y-6">
            <div id="games-container" class="space-y-8">
                <div class="text-center py-12 text-slate-400 animate-pulse">
                    ⌛ Lade Serie A Spiele von ESPN...
                </div>
            </div>
        </div>

        <!-- TAB 2: TABELLE -->
        <div id="tab-content-standings" class="hidden space-y-8">
            <div class="bg-blue-950/40 p-6 rounded-2xl border border-blue-900/60 shadow-xl space-y-4 backdrop-blur-sm">
                <div class="flex justify-between items-center border-b border-blue-900/60 pb-3">
                    <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2">🏆 Serie A Tabelle 2026/27</h2>
                    <div class="flex items-center gap-4 text-xs font-semibold">
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Champions League</span>
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Europa League</span>
                        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Abstieg</span>
                    </div>
                </div>

                <div class="overflow-x-auto custom-scroll">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-blue-950 text-blue-300 uppercase text-xs">
                            <tr>
                                <th class="px-3 py-3 min-w-[40px]">#</th>
                                <th class="px-4 py-3 min-w-[200px]">Club</th>
                                <th class="px-3 py-3 text-center">Sp</th>
                                <th class="px-3 py-3 text-center">S</th>
                                <th class="px-3 py-3 text-center">U</th>
                                <th class="px-3 py-3 text-center">N</th>
                                <th class="px-3 py-3 text-center">Tore</th>
                                <th class="px-3 py-3 text-center">Diff</th>
                                <th class="px-4 py-3 text-center font-bold text-emerald-400">Pkt</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-blue-900/40">
                            <tr><td colspan="9" class="px-4 py-6 text-center text-slate-500">Lade Tabelle...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIK -->
    <script>
        let leagueEvents = [];
        let autoRefreshTimer = null;
        let matchDetailsCache = {};

        function switchTab(tabName) {
            const tabs = ['games', 'standings'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                if (t === tabName) {
                    btn.className = "px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-900/80 text-emerald-400 border-t-2 border-emerald-400 transition shadow-lg";
                    content.classList.remove("hidden");
                } else {
                    btn.className = "px-5 py-2.5 font-bold text-sm rounded-t-xl bg-blue-950/40 text-slate-400 hover:text-white transition";
                    content.classList.add("hidden");
                }
            });
        }

        function onTimeframeChange() {
            const mode = document.getElementById("timeframe-select").value;
            const dateWrapper = document.getElementById("single-date-wrapper");

            if (mode === 'single') {
                dateWrapper.classList.remove("hidden");
                dateWrapper.classList.add("flex");
                if (!document.getElementById("single-date-input").value) {
                    document.getElementById("single-date-input").value = new Date().toISOString().split('T')[0];
                }
            } else {
                dateWrapper.classList.add("hidden");
                dateWrapper.classList.remove("flex");
            }
            loadSerieAGames();
        }

        async function refreshAllData() {
            loadSerieAGames();
            await loadStandings();
        }

        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
        }

        // Exakte Datums-Zuordnung für alle 38 Spieltage basierend auf deinen Vorgaben
        const matchdayDateMap = {
            1: ['20260822', '20260823', '20260824'],
            2: ['20260828', '20260829', '20260830', '20260831'],
            3: ['20260904', '20260905', '20260906', '20260907'],
            4: ['20260911', '20260912', '20260913', '20260914'],
            5: ['20260918', '20260919', '20260920'],
            6: ['20261010', '20261011', '20261012'],
            7: ['20261016', '20261017', '20261018', '20261019'],
            8: ['20261023', '20261024', '20261025'],
            9: ['20261027', '20261028', '20261029'],
            10: ['20261031', '20261101', '20261102'],
            11: ['20261106', '20261107', '20261108'],
            12: ['20261121', '20261122', '20261123'],
            13: ['20261127', '20261128', '20261129', '20261130'],
            14: ['20261204', '20261205', '20261206', '20261207'],
            15: ['20261211', '20261212', '20261213', '20261214'],
            16: ['20261218', '20261219', '20261220'],
            17: ['20270102', '20270103'],
            18: ['20270105', '20270106', '20270107'],
            19: ['20270109', '20270110', '20270111'],
            20: ['20270117'],
            21: ['20270124'],
            22: ['20270131'],
            23: ['20270207'],
            24: ['20270214'],
            25: ['20270221'],
            26: ['20270228'],
            27: ['20270307'],
            28: ['20270314'],
            29: ['20270321'],
            30: ['20270404'],
            31: ['20270411'],
            32: ['20270418'],
            33: ['20270425'],
            34: ['20270502'],
            35: ['20270509'],
            36: ['20270516'],
            37: ['20270523'],
            38: ['20270530']
        };

        async function loadSerieAGames() {
            const container = document.getElementById("games-container");
            container.innerHTML = `<div class="text-center py-12 text-slate-400 animate-pulse">⌛ Lade Serie A Spiele von ESPN...</div>`;

            const mode = document.getElementById("timeframe-select").value;
            let datesToFetch = [];

            if (mode === 'single') {
                const val = document.getElementById("single-date-input").value;
                if (val) {
                    datesToFetch.push(val.replace(/-/g, ''));
                } else {
                    datesToFetch.push(formatDateKey(new Date()));
                }
            } else if (mode === 'all') {
                let start = new Date(2026, 7, 1);
                let end = new Date(2027, 5, 30);
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 7)) {
                    datesToFetch.push(formatDateKey(d));
                }
            } else {
                datesToFetch = matchdayDateMap[parseInt(mode)] || [];
            }

            try {
                let fetchUrls = [];
                if (mode === 'all') {
                    fetchUrls = [`https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard`];
                } else {
                    fetchUrls = datesToFetch.map(dateStr => `https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard?dates=${dateStr}`);
                }

                const promises = fetchUrls.map(url => 
                    fetch(url)
                        .then(res => res.json())
                        .then(data => data.events || [])
                        .catch(() => [])
                );

                const results = await Promise.all(promises);
                const eventMap = {};
                results.flat().forEach(e => {
                    if (e && e.id) eventMap[e.id] = e;
                });

                leagueEvents = Object.values(eventMap);
                leagueEvents.sort((a, b) => new Date(a.date) - new Date(b.date));

                checkLiveState();
                renderGroupedGames();
            } catch (error) {
                console.error("Fehler beim Abrufen der Spieldaten:", error);
                container.innerHTML = '<div class="text-center py-8 text-rose-400">⚠️ Fehler beim Laden der Spieldaten.</div>';
            }
        }

        async function fetchMatchDetails(eventId) {
            if (matchDetailsCache[eventId]) return matchDetailsCache[eventId];
            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/summary?event=${eventId}`);
                const data = await res.json();
                
                let goals = [];
                const details = data.details || [];
                details.forEach(item => {
                    if (item.scoringPlay) {
                        goals.push({
                            text: item.text || 'Tor'
                        });
                    }
                });

                if (goals.length === 0 && data.goals) {
                    data.goals.forEach(g => {
                        goals.push({
                            text: `${g.athlete?.displayName || 'Spieler'} (${g.clock?.displayValue || ''}')`
                        });
                    });
                }

                matchDetailsCache[eventId] = goals;
                return goals;
            } catch (e) {
                return [];
            }
        }

        function checkLiveState() {
            const isLive = leagueEvents.some(e => e.status?.type?.state === "in");
            const liveIndicator = document.getElementById("live-indicator");

            if (isLive) {
                liveIndicator.classList.remove("hidden");
                liveIndicator.classList.add("flex");
                if (!autoRefreshTimer) {
                    autoRefreshTimer = setInterval(refreshAllData, 15000);
                }
            } else {
                liveIndicator.classList.add("hidden");
                liveIndicator.classList.remove("flex");
                if (autoRefreshTimer) {
                    clearInterval(autoRefreshTimer);
                    autoRefreshTimer = null;
                }
            }
        }

        async function renderGroupedGames() {
            const container = document.getElementById("games-container");
            container.innerHTML = "";

            if (leagueEvents.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500">Für diesen Spieltag sind keine Serie A Spiele hinterlegt.</div>`;
                return;
            }

            const groupedMap = {};

            leagueEvents.forEach(event => {
                const gameDate = new Date(event.date);
                const dateKey = gameDate.toLocaleDateString("de-DE", { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
                
                if (!groupedMap[dateKey]) {
                    groupedMap[dateKey] = [];
                }
                groupedMap[dateKey].push(event);
            });

            for (const dateHeader of Object.keys(groupedMap)) {
                const daySection = document.createElement("div");
                daySection.className = "space-y-4";

                daySection.innerHTML = `
                    <div class="flex items-center gap-2 border-b border-blue-900/60 pb-2">
                        <span class="text-lg font-bold text-emerald-400">📅 ${dateHeader}</span>
                        <span class="text-xs text-slate-400 font-medium">(${groupedMap[dateHeader].length} Spiele)</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="group-${dateHeader.replace(/[^a-zA-Z0-9]/g, '')}"></div>
                `;

                container.appendChild(daySection);
                const groupGrid = daySection.querySelector(`#group-${dateHeader.replace(/[^a-zA-Z0-9]/g, '')}`);

                for (const event of groupedMap[dateHeader]) {
                    const competition = event.competitions?.[0];
                    const home = competition?.competitors?.find(c => c.homeAway === "home");
                    const away = competition?.competitors?.find(c => c.homeAway === "away");

                    const status = event.status?.type;
                    const isLive = status?.state === "in";
                    const isCompleted = status?.completed;

                    const gameDate = new Date(event.date);
                    const formattedTimeStr = gameDate.toLocaleTimeString("de-DE", { hour: '2-digit', minute: '2-digit' }) + " Uhr";

                    let statusBadgeClass = "bg-blue-950 text-blue-300 border border-blue-800";
                    let statusText = `${formattedTimeStr}`;

                    if (isLive) {
                        statusBadgeClass = "bg-red-950 text-red-300 border border-red-600 live-dot font-bold";
                        statusText = `🔴 LIVE - ${status?.detail || 'In Progress'}`;
                    } else if (isCompleted) {
                        statusBadgeClass = "bg-emerald-950/80 text-emerald-300 border border-emerald-700 font-bold";
                        statusText = "ENDE";
                    }

                    // Torschützen laden
                    let goalsHtml = "";
                    if ((isCompleted || isLive || (home?.score > 0 || away?.score > 0)) && event.id) {
                        const goals = await fetchMatchDetails(event.id);
                        if (goals && goals.length > 0) {
                            const goalItems = goals.map(g => `<div class="text-xs text-slate-300 flex items-center gap-1.5 py-0.5"><span>⚽</span> <span class="truncate">${g.text}</span></div>`).join('');
                            goalsHtml = `
                                <div class="mt-3 pt-2 border-t border-blue-900/40 space-y-1 bg-blue-950/30 p-2 rounded-lg">
                                    <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Torschützen:</div>
                                    ${goalItems}
                                </div>
                            `;
                        }
                    }

                    const card = document.createElement("div");
                    card.className = "bg-blue-950/40 p-4 rounded-xl border border-blue-900/60 shadow-lg space-y-3 hover:border-blue-700/60 transition backdrop-blur-sm";

                    card.innerHTML = `
                        <div class="flex justify-between items-center text-xs text-slate-400 font-semibold border-b border-blue-900/40 pb-2">
                            <span>${formattedTimeStr}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] ${statusBadgeClass}">${statusText}</span>
                        </div>

                        <div class="space-y-2">
                            <!-- Heimteam -->
                            <div class="flex justify-between items-center bg-blue-900/20 border border-blue-900/40 rounded-lg p-2.5 ${home?.winner ? 'border-emerald-500/50 bg-emerald-950/20' : ''}">
                                <div class="flex items-center gap-2.5 overflow-hidden">
                                    <img src="${home?.team?.logo || ''}" class="w-6 h-6 object-contain flex-shrink-0" alt="Logo">
                                    <span class="font-bold text-white text-sm truncate ${home?.winner ? 'text-emerald-400' : ''}">${home?.team?.displayName || 'Heimteam'}</span>
                                </div>
                                <span class="bg-blue-950 border border-blue-800 text-white font-black px-2.5 py-1 rounded-md text-base min-w-[36px] text-center ${home?.winner ? 'border-emerald-500 text-emerald-400 bg-emerald-950/40' : ''}">
                                    ${home?.score !== undefined && home?.score !== null ? home.score : '-'}
                                </span>
                            </div>

                            <!-- Auswärtsteam -->
                            <div class="flex justify-between items-center bg-blue-900/20 border border-blue-900/40 rounded-lg p-2.5 ${away?.winner ? 'border-emerald-500/50 bg-emerald-950/20' : ''}">
                                <div class="flex items-center gap-2.5 overflow-hidden">
                                    <img src="${away?.team?.logo || ''}" class="w-6 h-6 object-contain flex-shrink-0" alt="Logo">
                                    <span class="font-bold text-white text-sm truncate ${away?.winner ? 'text-emerald-400' : ''}">${away?.team?.displayName || 'Auswärtsteam'}</span>
                                </div>
                                <span class="bg-blue-950 border border-blue-800 text-white font-black px-2.5 py-1 rounded-md text-base min-w-[36px] text-center ${away?.winner ? 'border-emerald-500 text-emerald-400 bg-emerald-950/40' : ''}">
                                    ${away?.score !== undefined && away?.score !== null ? away.score : '-'}
                                </span>
                            </div>
                        </div>
                        ${goalsHtml}
                    `;
                    groupGrid.appendChild(card);
                }
            }
        }

        async function loadStandings() {
            const url = "https://site.api.espn.com/apis/v2/sports/soccer/ita.1/standings";
            const tbody = document.getElementById("table-body");

            try {
                const response = await fetch(url);
                const data = await response.json();

                const entries = data.children?.[0]?.standings?.entries || data.standings?.entries || [];
                renderTable(entries, tbody);

            } catch (error) {
                console.error("Fehler beim Abrufen der Tabelle:", error);
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-6 text-center text-rose-400">Fehler beim Laden der Tabelle.</td></tr>';
            }
        }

        function renderTable(entries, tbody) {
            tbody.innerHTML = "";

            if (!entries || entries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-6 text-center text-slate-500">Keine Tabellendaten gefunden.</td></tr>';
                return;
            }

            entries.forEach((entry, idx) => {
                const team = entry.team;
                const stats = entry.stats || [];

                const getStat = (name) => stats.find(s => s.name === name)?.displayValue || "0";

                const rank = idx + 1;
                const games = getStat("gamesPlayed");
                const wins = getStat("wins");
                const draws = getStat("ties");
                const losses = getStat("losses");
                const points = getStat("points");
                const diff = getStat("pointDifferential");
                const goalsFor = getStat("pointsFor");
                const goalsAgainst = getStat("pointsAgainst");

                let rankStyle = "text-slate-400 border-l-2 border-transparent";
                if (rank <= 4) rankStyle = "text-emerald-400 font-extrabold border-l-4 border-emerald-400 pl-1";
                else if (rank === 5 || rank === 6) rankStyle = "text-blue-400 font-bold border-l-4 border-blue-500 pl-1";
                else if (rank >= 18) rankStyle = "text-rose-400 font-bold border-l-4 border-rose-500 pl-1";

                const row = document.createElement("tr");
                row.className = idx % 2 === 0 ? "bg-blue-950/30 hover:bg-blue-900/50 transition" : "bg-blue-950/10 hover:bg-blue-900/50 transition";

                row.innerHTML = `
                    <td class="px-3 py-3 ${rankStyle}">${rank}</td>
                    <td class="px-4 py-3 font-semibold text-white flex items-center gap-3">
                        <img src="${team?.logos?.[0]?.href || ''}" class="w-6 h-6 object-contain" alt="Logo">
                        ${team?.displayName || 'Unbekannt'}
                    </td>
                    <td class="px-3 py-3 text-center text-slate-300">${games}</td>
                    <td class="px-3 py-3 text-center text-slate-300">${wins}</td>
                    <td class="px-3 py-3 text-center text-slate-300">${draws}</td>
                    <td class="px-3 py-3 text-center text-slate-300">${losses}</td>
                    <td class="px-3 py-3 text-center text-slate-400">${goalsFor}:${goalsAgainst}</td>
                    <td class="px-3 py-3 text-center font-medium ${parseInt(diff) > 0 ? 'text-emerald-400' : (parseInt(diff) < 0 ? 'text-rose-400' : 'text-slate-400')}">${diff}</td>
                    <td class="px-4 py-3 text-center font-black text-emerald-400 text-base">${points}</td>
                `;
                tbody.appendChild(row);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadSerieAGames();
            loadStandings();
        });
    </script>
</body>
</html>
